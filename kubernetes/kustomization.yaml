apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres/initdb-configmap.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - backend/auth/configmap.yaml
  - backend/auth/deployment.yaml
  - backend/auth/service.yaml
  - backend/store/deployment.yaml
  - backend/store/service.yaml
  - backend/ranking/deployment.yaml
  - backend/ranking/service.yaml
  - backend/game/configmap.yaml
  - backend/game/deployment.yaml
  - backend/game/service.yaml
  - frontend/auth/deployment.yaml
  - frontend/auth/service.yaml
  - frontend/store/deployment.yaml
  - frontend/store/service.yaml
  - frontend/ranking/deployment.yaml
  - frontend/ranking/service.yaml
  - frontend/game/deployment.yaml
  - frontend/game/service.yaml
  - assets/pvc.yaml
  - assets/configmap.yaml
  - assets/deployment.yaml
  - assets/service.yaml
  - ingress/middleware.yaml
  - ingress/ingress.yaml
images:
  - name: ghcr.io/analaura-gb/dungeonbox-auth-backend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-store-backend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-ranking-backend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-game-backend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-auth-frontend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-store-frontend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-ranking-frontend
    newTag: REPLACE_WITH_SHA
  - name: ghcr.io/analaura-gb/dungeonbox-game-frontend
    newTag: REPLACE_WITH_SHA
