apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-frontend
  namespace: dungeonbox
  labels:
    app.kubernetes.io/name: store-frontend
    app.kubernetes.io/part-of: dungeonbox
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: store-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-frontend
        app.kubernetes.io/part-of: dungeonbox
    spec:
      nodeSelector:
        module: store
        layer: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: store
          image: ghcr.io/analaura-gb/dungeonbox-store-frontend:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
