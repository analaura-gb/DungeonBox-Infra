apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: dungeonbox
  labels:
    app.kubernetes.io/name: auth-migrate
    app.kubernetes.io/part-of: dungeonbox
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migrate
        app.kubernetes.io/part-of: dungeonbox
    spec:
      restartPolicy: Never
      nodeSelector:
        module: auth
        layer: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/analaura-gb/dungeonbox-auth-migrator:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: auth-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
