apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-backend
  namespace: dungeonbox
  labels:
    app.kubernetes.io/name: ranking-backend
    app.kubernetes.io/part-of: dungeonbox
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ranking-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranking-backend
        app.kubernetes.io/part-of: dungeonbox
    spec:
      nodeSelector:
        module: ranking
        layer: backend
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ranking-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ranking
          image: ghcr.io/analaura-gb/dungeonbox-ranking-backend:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: dungeonbox-jwt
            - secretRef:
                name: ranking-backend-secrets
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
